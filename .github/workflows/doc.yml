name: Generate Gazu Specs for developer docs

# Immutable releases are on: a release cannot change after publication,
# so each version tag gets its own release with the specs.
on:
  push:
    tags:
      - "v*"

jobs:
  docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        if: ${{ !contains(fromJSON('["3.7"]'), matrix.version) }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.version }}
          cache: pip
      - name: Upgrade pip 📦
        run: >-
          python -m
          pip install
          --upgrade
          pip
      - name: Install packages 📦
        run: >-
          python -m
          pip install
          -r requirements.txt
      # Pinned to a commit SHA (was @master); bump deliberately after review.
      - uses: ammaraskar/sphinx-action@c61ac11d9ee097caf8983c10c8b5af5861b32b54
        with:
          docs-folder: "docs/"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: docs/build/html/gazu-specs.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
